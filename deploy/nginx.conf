# /etc/nginx/sites-available/studyprep.ssopros.com
#
# Installed by deploy/setup.sh. certbot rewrites this file to add the TLS
# server block and the 80 -> 443 redirect, so do not hand-edit those parts;
# re-run setup.sh or `certbot --nginx` instead.

server {
    listen 80;
    listen [::]:80;
    server_name studyprep.ssopros.com;

    # Node serves both the API and the static files, so nginx is purely a
    # TLS terminator and reverse proxy. Keeping one origin means the browser
    # sends the session cookie with API calls without any CORS handling.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # health check stays on HTTP so uptime monitors do not need TLS
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 2m;

    # the app is one small page; anything asking for these is a scanner
    location ~ /\.(?!well-known) { deny all; }

    access_log /var/log/nginx/studyprep.access.log;
    error_log  /var/log/nginx/studyprep.error.log;
}
